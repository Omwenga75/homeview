<!DOCTYPE html>
<html>
<head>
    <title>Approve House</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script>if(localStorage.getItem('hv_current_user')) document.documentElement.classList.add('hv-logged-in');</script>
</head>
<body>
    <div id="result"></div>
    <script>
        fetch('http://127.0.0.1:8000/houses/1', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                status: 'approved'
            })
        })
        .then(response => {
            document.getElementById('result').innerText += 'Status: ' + response.status + '\n';
            return response.json();
        })
        .then(data => {
            document.getElementById('result').innerText += 'Response: ' + JSON.stringify(data) + '\n';
        })
        .catch(error => {
            document.getElementById('result').innerText += 'Error: ' + error + '\n';
        });
    </script>
</body>
</html>
