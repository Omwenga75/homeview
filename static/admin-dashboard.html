<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - HomeView</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body class="admin-dashboard">
    <header id="navbar">
        <div class="container mobile-header-bar">
            <button id="mobileNavToggle" class="mobile-nav-toggle" type="button" aria-label="Open menu">☰</button>
            <a href="index.html" class="logo">
                <span class="text">HomeView</span>
            </a>
            <div class="header-actions" style="margin-left: auto; display: flex; align-items: center; gap: 1rem;">
                <a href="#" class="mobile-link-chip" data-view="overview">Overview</a>
                <a href="#" class="mobile-link-chip" data-view="profile">Profile</a>
                <div id="userProfileToggle">
                    <div class="user-dp">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <div class="user-greeting">
                        <span class="greeting-text">Good evening,</span>
                        <span id="userName" class="user-name">Guest</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="mobile-drawer-backdrop" id="mobileDrawerBackdrop"></div>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-top-row">
                <strong>Admin Menu</strong>
                <button id="mobileDrawerClose" class="drawer-close" type="button" aria-label="Close menu">✕</button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="sidebar-link active" data-view="overview">Overview</a></li>
                <li><a href="#" class="sidebar-link" data-view="houses">Houses</a></li>
                <li><a href="#" class="sidebar-link" data-view="users">User Management</a></li>
                <li><a href="#" class="sidebar-link" data-view="messages">Messages</a></li>
                <li><a href="#" class="sidebar-link" data-view="transactions">Transactions</a></li>
                <li><a href="#" class="sidebar-link" data-view="profile">My Profile</a></li>
                <li><a href="#" class="sidebar-link" data-view="settings">Platform Settings</a></li>
                <li style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem;"><a href="#" class="sidebar-link" id="sidebarLogout" style="color: #EF4444;">Sign Out</a></li>
            </ul>
        </aside>
        <main class="dashboard-main">
            <!-- Content will be rendered dynamically by JS -->
        </main>
    </div>

        <!-- Bottom Navigation for Admin -->
    <nav class="bottom-nav">
        <a href="#" class="bottom-nav-item active" data-view="overview">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </span>
            <span>Dashboard</span>
        </a>
        <a href="#" class="bottom-nav-item" data-view="houses">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </span>
            <span>Houses</span>
        </a>
        <a href="#" class="bottom-nav-item" data-view="users">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </span>
            <span>Users</span>
        </a>
        <a href="#" class="bottom-nav-item" data-view="transactions">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            </span>
            <span>Payments</span>
        </a>
        <a href="#" class="bottom-nav-item" data-view="messages">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </span>
            <span>Messages</span>
        </a>
        <a href="#" class="bottom-nav-item" data-view="profile">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <span>Profile</span>
        </a>
    </nav>

    <script src="main.js"></script>
    <script>
        // Admin Dashboard specific logic
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if user is logged in as admin
            const user = JSON.parse(localStorage.getItem('hv_current_user'));
            if (!user || user.role !== 'admin') {
                window.location.href = 'login.html';
                return;
            }            // Update welcome name
            const welcomeName = document.getElementById('welcomeName');
            if (welcomeName) welcomeName.textContent = user.name.split(' ')[0];

            const mainContent = document.querySelector('.dashboard-main');

            async function getHouses() {
                // If mock mode is enabled, skip fetch entirely to avoid console errors
                if (typeof HV_CONFIG !== 'undefined' && HV_CONFIG.USE_MOCK) {
                    return getMockHouses();
                }

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 1500);
                    
                    const res = await fetch(`${HV_CONFIG.API_BASE}/houses/`, { signal: controller.signal }).catch(() => null);
                    clearTimeout(timeoutId);
                    
                    if (!res || !res.ok) throw new Error('Offline');
                    return await res.json();
                } catch (error) {
                    return getMockHouses();
                }
            }

            function getMockHouses() {
                return [];
            }


            async function saveHouse(house) {
                try {
                    const res = await fetch(`${HV_CONFIG.API_BASE}/houses`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: house.title,
                            location: house.location,
                            price: house.rawPrice,
                            description: house.description,
                            owner_name: house.ownerName,
                            owner_email: house.ownerEmail,
                            photo_urls: JSON.stringify(house.photos || [])
                        })
                    });
                    if (!res.ok) throw new Error('Failed to save house');
                    return await res.json();
                } catch (error) {
                    console.error('Error saving house:', error);
                    alert('Failed to submit house. Please try again.');
                    return null;
                }
            }

            async function updateHouseStatus(houseId, status) {
                try {
                    const res = await fetch(`${HV_CONFIG.API_BASE}/houses/${houseId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status })
                    });
                    if (!res.ok) throw new Error('Update failed');
                    return true;
                } catch (err) {
                    console.error('Failed to update house status:', err);
                    alert('Failed to update house status. Please try again.');
                    return false;
                }
            }

            async function deleteHouse(houseId) {
                try {
                    const res = await fetch(`${HV_CONFIG.API_BASE}/houses/${houseId}`, {
                        method: 'DELETE'
                    });
                    if (!res.ok) throw new Error('Delete failed');
                    return true;
                } catch (err) {
                    console.error('Failed to delete house:', err);
                    alert('Failed to delete house. Please try again.');
                    return false;
                }
            }

            function formatHousePrice(price) {
                const value = Number(price);
                return isNaN(value) ? price : `Sh. ${value.toLocaleString('en-US')}`;
            }

            const adminProfilePanel = document.getElementById('adminProfilePanel');
            if (adminProfilePanel) {
                const allHouses = await getHouses();
                const pendingCount = allHouses.filter(h => h.status === 'pending').length;
                adminProfilePanel.innerHTML = `
                    <div class="profile-card profile-card-wide">
                        <div class="profile-card-avatar"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></div>
                        <div class="profile-card-body">
                            <p class="profile-label">Administrator</p>
                            <h2>${user.name}</h2>
                            <p>${user.email || 'admin@homeview.com'}</p>
                        </div>
                        <div class="profile-card-meta">
                            <div><strong>Role</strong><span>Admin</span></div>
                            <div><strong>Status</strong><span>Online</span></div>
                        </div>
                    </div>
                `;
            }



            async function renderAdminView(viewType) {
                const allHouses = await getHouses();
                if (viewType === 'overview' || viewType === 'approvals') {
                    const totalHouses = allHouses.length;
                    const approvedHouses = allHouses.filter(h => h.status === 'approved');
                    const pendingHouses = allHouses.filter(h => h.status === 'pending');
                    const totalRevenue = approvedHouses.reduce((sum, h) => sum + (Number(h.price) || 0), 0);

                    const allHousesRows = allHouses.length ? allHouses.map(h => {
                        const statusColor = h.status === 'approved' ? '#10b981' : (h.status === 'suspended' ? '#f59e0b' : (h.status === 'pending' ? '#3b82f6' : '#ef4444'));
                        const statusLabel = h.status ? h.status.charAt(0).toUpperCase() + h.status.slice(1) : 'Pending';
                        
                        let actionsHtml = '';
                        if (h.status === 'pending') {
                            actionsHtml = `
                                <button class="btn btn-sm btn-primary approve-btn" data-id="${h.id}" style="margin-right:0.5rem">Approve</button>
                                <button class="btn btn-sm reject-btn" data-id="${h.id}" style="background:#fee2e2;color:#dc2626;border:none;padding:0.4rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;margin-right:0.5rem">Reject</button>
                            `;
                        } else if (h.status === 'approved') {
                            actionsHtml = `
                                <button class="btn btn-sm suspend-btn" data-id="${h.id}" style="background:#fef3c7;color:#d97706;border:none;padding:0.4rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;margin-right:0.5rem">Suspend</button>
                            `;
                        } else if (h.status === 'suspended') {
                            actionsHtml = `
                                <button class="btn btn-sm activate-btn" data-id="${h.id}" style="background:#d1fae5;color:#059669;border:none;padding:0.4rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;margin-right:0.5rem">Activate</button>
                            `;
                        }
                        
                        // Delete button is always available
                        actionsHtml += `<button class="btn btn-sm delete-btn" data-id="${h.id}" style="background:#fee2e2;color:#dc2626;border:none;padding:0.4rem 1rem;border-radius:8px;cursor:pointer;font-weight:600">Delete</button>`;

                        return `
                        <tr>
                            <td style="font-weight:600">${h.owner_name || 'Unknown'}</td>
                            <td>${h.title}</td>
                            <td>${h.location}</td>
                            <td><span style="display:inline-block;padding:0.25rem 0.75rem;border-radius:9999px;font-size:0.8rem;font-weight:600;background:${statusColor}20;color:${statusColor}">${statusLabel}</span></td>
                            <td>${actionsHtml}</td>
                        </tr>`;
                    }).join('') : `<tr><td colspan="5" style="text-align:center;padding:2.5rem;color:var(--text-muted)">No houses found in the system.</td></tr>`;

                    mainContent.innerHTML = `
                        <div class="dashboard-header" style="margin-bottom: 2rem;">
                            <h1>Platform Control Center</h1>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <span class="label">Total Houses</span>
                                <div class="value">${totalHouses}</div>
                            </div>
                            <div class="stat-card">
                                <span class="label">Approved Listings</span>
                                <div class="value">${approvedHouses.length}</div>
                            </div>
                            <div class="stat-card">
                                <span class="label">Pending Reviews</span>
                                <div class="value" style="color:${pendingHouses.length > 0 ? '#f59e0b' : '#10b981'}">${pendingHouses.length}</div>
                            </div>
                            <div class="stat-card">
                                <span class="label">Total Revenue</span>
                                <div class="value">Sh. ${totalRevenue.toLocaleString('en-US')}</div>
                            </div>
                            <div class="stat-card">
                                <span class="label">System Health</span>
                                <div class="value" style="color:#10b981">99.9%</div>
                            </div>
                            <div class="stat-card">
                                <span class="label">Total Users</span>
                                <div class="value">1,240</div>
                            </div>
                        </div>
                    `;
                } else if (viewType === 'houses') {
                    mainContent.innerHTML = `
                        <div class="dashboard-header" style="margin-bottom: 2rem;">
                            <h1>Houses Management</h1>
                        </div>
                        <div class="section-card" style="background: white; padding: 2.5rem; border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
                            <div class="section-header" style="margin-bottom: 1.5rem; display:flex; justify-content:space-between; align-items:center;">
                                <h2>All Houses Management <span style="font-size:1rem;color:var(--primary);font-weight:600">(${allHouses.length})</span></h2>
                            </div>
                            <div class="table-container" style="border: none; border-radius: 0; margin-top: 0;">
                                <table>
                                    <thead><tr><th>Caretaker</th><th>House Title</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead>
                                    <tbody>${allHousesRows}</tbody>
                                </table>
                            </div>
                        </div>
                    `;
                } else if (viewType === 'add-house') {
                    mainContent.innerHTML = `
                        <div class="dashboard-header" style="margin-bottom: 2rem;">
                            <h1>Add New House</h1>
                        </div>
                        <div style="padding: 0; background: transparent; border: none; box-shadow: none;">
                            <form id="adminHouseForm" style="display: grid; gap: 1rem;">
                                <div class="add-house-grid">
                                    <article class="add-house-card">
                                        <h3>Property Details</h3>
                                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                                            <div class="form-group">
                                                <label for="adminHouseType">House Type</label>
                                                <select id="adminHouseType" required>
                                                    <option value="" disabled selected>Select Type</option>
                                                    <option value="Bedsitter">Bedsitter</option>
                                                    <option value="Single Room">Single Room</option>
                                                    <option value="Double Room">Double Room</option>
                                                    <option value="Studio">Studio</option>
                                                    <option value="1 Bedroom">1 Bedroom</option>
                                                    <option value="2 Bedroom">2 Bedroom</option>
                                                    <option value="3 Bedroom">3 Bedroom</option>
                                                    <option value="4 Bedroom">4 Bedroom</option>
                                                    <option value="Penthouse">Penthouse</option>
                                                    <option value="Townhouse">Townhouse</option>
                                                    <option value="Villa">Villa</option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label for="adminEstate">Estate / Area</label>
                                                <input type="text" id="adminEstate" placeholder="e.g. Kileleshwa" required>
                                            </div>
                                            <div class="form-group">
                                                <label for="adminCounty">County / City</label>
                                                <input type="text" id="adminCounty" placeholder="e.g. Nairobi" required>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label for="adminPrice">Monthly Price (Sh.)</label>
                                            <input type="number" id="adminPrice" placeholder="45000" required>
                                        </div>
                                    </article>



                                    <article class="add-house-card">
                                        <h3>Owner & Media</h3>
                                        <div class="form-group">
                                            <label for="adminOwnerName">Owner Name</label>
                                            <input type="text" id="adminOwnerName" placeholder="Caretaker name" value="${user.name || ''}" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="adminOwnerEmail">Owner Email</label>
                                            <input type="email" id="adminOwnerEmail" placeholder="owner@email.com" value="${user.email || ''}" required>
                                        </div>
                                    </article>
                                </div>
                                <button type="submit" class="btn btn-primary" style="width: fit-content;">Save House</button>
                            </form>
                        </div>
                    `;



                    const adminHouseForm = document.getElementById('adminHouseForm');
                    if (adminHouseForm) {
                        adminHouseForm.addEventListener('submit', async (e) => {
                            e.preventDefault();
                            const houseType = document.getElementById('adminHouseType').value;
                            const estate = document.getElementById('adminEstate').value.trim();
                            const county = document.getElementById('adminCounty').value.trim();
                            
                            const price = document.getElementById('adminPrice').value.trim();
                            const description = `A beautiful ${houseType} located in ${estate}, ${county}. Available for Sh. ${price} per month.`;
                            const ownerName = document.getElementById('adminOwnerName').value.trim();
                            const ownerEmail = document.getElementById('adminOwnerEmail').value.trim();

                            if (!houseType || !estate || !county || !price) {
                                alert('Please fill in all house details before saving.');
                                return;
                            }

                            const title = `${houseType} in ${estate}`;
                            const location = `${estate}, ${county}`;

                            const saved = await saveHouse({
                                title,
                                location,
                                rawPrice: Number(price),
                                description,
                                ownerName: ownerName || user.name,
                                ownerEmail: ownerEmail || user.email,
                                photos: []
                            });

                            if (saved) {
                                alert('House added successfully and sent for review.');
                                setActiveSidebar('overview');
                                await renderAdminView('overview');
                            }
                        });
                    }
                } else if (viewType === 'users') {
                    mainContent.innerHTML = `
                        <div class="dashboard-header" style="margin-bottom: 2rem;">
                            <h1>User Management</h1>
                        </div>
                        <div class="section-card" style="background: white; padding: 4rem 2rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-md); text-align: center;">
                            <p style="font-size: 3rem; margin-bottom: 1rem;"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></p>
                            <p style="color: var(--text-secondary); font-size: 1.1rem;">User management features coming soon</p>
                            <p style="color: var(--text-muted); margin-top: 0.5rem;">This will include caretaker and tenant account management.</p>
                        </div>
                    `;
                } else if (viewType === 'messages') {
                    const messages = JSON.parse(localStorage.getItem('hv_admin_messages') || '[]');
                    mainContent.innerHTML = `
                        <div class="dashboard-header" style="margin-bottom: 2rem;">
                            <h1>User Messages</h1>
                        </div>
                        <div class="section-card" style="background: white; padding: 2.5rem; border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
                            <div class="table-container" style="border: none; border-radius: 0; margin-top: 0;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Sender</th>
                                        <th>Email</th>
                                        <th>Message</th>
                                        <th>Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${messages.reverse().map(msg => `
                                        <tr>
                                            <td style="font-weight: 600;">${msg.name}</td>
                                            <td>${msg.email}</td>
                                            <td style="max-width: 300px; white-space: normal; line-height: 1.4;">${msg.message}</td>
                                            <td style="font-size: 0.85rem; color: var(--text-muted);">${new Date(msg.date).toLocaleDateString()}</td>
                                        </tr>
                                    `).join('')}
                                    ${messages.length === 0 ? '<tr><td colspan="4" style="text-align: center; padding: 3rem; color: var(--text-muted);">No messages found.</td></tr>' : ''}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else if (viewType === 'transactions') {
                    mainContent.innerHTML = `
                        <div class="dashboard-header" style="margin-bottom: 2rem;">
                            <h1>Transactions</h1>
                        </div>
                        <div class="section-card" style="background: white; padding: 4rem 2rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-md); text-align: center;">
                            <p style="font-size: 3rem; margin-bottom: 1rem;">💰</p>
                            <p style="color: var(--text-secondary); font-size: 1.1rem;">Transaction tracking coming soon</p>
                            <p style="color: var(--text-muted); margin-top: 0.5rem;">Real-time payment processing and analytics.</p>
                        </div>
                    `;
                } else if (viewType === 'profile') {
                    mainContent.innerHTML = `
                        <div class="profile-section-container" style="max-width: 900px; margin: 0 auto; padding: 1rem 1rem;">
                            <!-- Premium Identity Header -->
                            <div class="profile-header-premium" style="background: white; border-radius: 16px; padding: 2rem; margin-bottom: 2rem; box-shadow: var(--shadow-md); border: 1px solid var(--border); position: relative; display: flex; align-items: center; gap: 2.5rem;">
                                <div class="profile-avatar-wrapper" style="flex-shrink: 0;">
                                    <div class="profile-avatar-large" style="width: 120px; height: 120px; border: 4px solid #f8fafc; box-shadow: var(--shadow-sm); font-size: 3rem;"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></div>
                                    <div class="profile-verified-badge" style="width: 32px; height: 32px; font-size: 1rem; bottom: 4px; right: 4px;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                                </div>
                                
                                <div class="profile-header-info" style="flex: 1;">
                                    <span class="profile-designation" style="color: var(--primary); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.9rem; margin-bottom: 0.75rem; display: block;">Executive Administrator</span>
                                    <h1 style="font-size: 2.2rem; color: var(--text-primary); margin: 0; line-height: 1.1;">${user.name}</h1>
                                    

                                    
                                    <div class="profile-meta-chips" style="margin-top: 2rem; display: flex; gap: 0.75rem;">
                                        <span style="background: #eff6ff; color: #1e40af; padding: 0.5rem 1.2rem; border-radius: 99px; font-size: 0.85rem; font-weight: 600;">System Core Access</span>
                                        <span style="background: #fff7ed; color: #9a3412; padding: 0.5rem 1.2rem; border-radius: 99px; font-size: 0.85rem; font-weight: 600;">Level 5 Governance</span>
                                    </div>
                                </div>
                            </div>

                            <div class="profile-grid-sections" style="display: flex; flex-direction: column; gap: 2rem;">
                                <!-- Official Identity Card -->

                        toggle.appendChild(knob);
                        const input = toggle.previousElementSibling;
                        const update = () => {
                            knob.style.left = input.checked ? '25px' : '3px';
                            toggle.style.background = input.checked ? 'var(--primary)' : '#cbd5e1';

                    l.classList.toggle('active', l.getAttribute('data-view') === viewType);
                });
                // Highlight bottom-nav items
                document.querySelectorAll('.bottom-nav-item').forEach(l => {
                    l.classList.toggle('active', l.getAttribute('data-view') === viewType);
                });
                
                // Update URL hash without jumping
                if (window.location.hash.replace('#', '') !== viewType) {
                    window.history.replaceState(null, null, '#' + viewType);
                }
            }

            function openMobileDrawer() {
                document.querySelector('.sidebar')?.classList.add('open');
                document.getElementById('mobileDrawerBackdrop')?.classList.add('active');
                document.body.classList.add('mobile-drawer-open');
            }

            function closeMobileDrawer() {
                document.querySelector('.sidebar')?.classList.remove('open');
                document.getElementById('mobileDrawerBackdrop')?.classList.remove('active');
                document.body.classList.remove('mobile-drawer-open');
            }

            document.getElementById('mobileNavToggle')?.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelector('.sidebar')?.classList.contains('open') ? closeMobileDrawer() : openMobileDrawer();

                        e.preventDefault();
                        setActiveNavigation(view);
                        await renderAdminView(view);
                        closeMobileDrawer();

                const activateBtn = e.target.closest('.activate-btn');
                const deleteBtn = e.target.closest('.delete-btn');

                const nextView = localStorage.getItem('hv_next_view');

                if (nextView) {
