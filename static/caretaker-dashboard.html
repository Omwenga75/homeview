<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caretaker Dashboard - HomeView</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body class="caretaker-dashboard">
    <header id="navbar" class="scrolled">
        <div class="container mobile-header-bar">
            <button id="mobileNavToggle" class="mobile-nav-toggle" type="button" aria-label="Open menu">☰</button>
            <a href="index.html" class="logo">
                <span class="text">HomeView</span>
            </a>
            <div class="header-actions">
                <div class="user-profile-dropdown">
                    <div id="userProfileToggle">
                        <div class="user-dp">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <div class="user-greeting">
                            <span class="greeting-text">Good morning,</span>
                            <span id="userName" class="user-name">Caretaker</span>
                        </div>
                    </div>
                    <div class="profile-menu" id="profileMenu">
                        <div class="profile-menu-item" id="goToProfileBtn">
                            <span>👤</span>
                            <span>My Profile</span>
                        </div>
                        <a href="index.html" class="profile-menu-item" id="tenantViewBtn" style="text-decoration: none; color: inherit;" onclick="localStorage.setItem('hv_caretaker_viewing_as_tenant','1'); localStorage.setItem('hv_next_view','home')">
                            <span>👀</span>
                            <span>Tenant View</span>
                        </a>
                        <div class="profile-menu-item" id="logoutBtn">
                            <span>🚪</span>
                            <span>Sign Out</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="mobile-drawer-backdrop" id="mobileDrawerBackdrop"></div>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-top-row">
                <strong>Menu</strong>
                <button id="mobileDrawerClose" class="drawer-close" type="button" aria-label="Close menu">✕</button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="sidebar-link active" data-view="dashboard">Dashboard</a></li>
                <li><a href="#" class="sidebar-link" data-view="houses">My Houses</a></li>
                <li><a href="#" class="sidebar-link" data-view="add-house">Add New House</a></li>
                <li><a href="#" class="sidebar-link" data-view="messages">Messages</a></li>
                <li><a href="#" class="sidebar-link" data-view="profile">My Profile</a></li>
                <li style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem;"><a href="#" class="sidebar-link" id="sidebarLogout" style="color: #EF4444;">Sign Out</a></li>
            </ul>
        </aside>

        <main class="dashboard-main">
            <!-- Content will be rendered dynamically by JS -->
        </main>
    </div>

        <!-- Bottom Navigation for Caretaker -->
    <nav class="bottom-nav">
        <a href="#" class="bottom-nav-item active" data-view="dashboard">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </span>
            <span>Dashboard</span>
        </a>
        <a href="#" class="bottom-nav-item" data-view="houses">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </span>
            <span>My Houses</span>
        </a>
        <a href="#" class="bottom-nav-item" data-view="add-house">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </span>
            <span>Add House</span>
        </a>
        <a href="#" class="bottom-nav-item" data-view="messages">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </span>
            <span>Messages</span>
        </a>
        <a href="#" class="bottom-nav-item" data-view="profile">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <span>Profile</span>
        </a>
    </nav>

    <script src="main.js"></script>
    <script>
        // Caretaker Dashboard specific logic
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if user is logged in
            const user = JSON.parse(localStorage.getItem('hv_current_user'));
            // Clear tenant view flag since we're back on caretaker dashboard
            localStorage.removeItem('hv_caretaker_viewing_as_tenant');
            if (!user || user.role !== 'caretaker') {
                window.location.href = 'login.html';
                return;
            }

            // Update user name in header
            document.getElementById('userName').textContent = user.name.split(' ')[0];

            // Sidebar Navigation with event delegation
            const API_BASE = '';
            const sidebarMenu = document.querySelector('.sidebar-menu');
            const mainContent = document.querySelector('.dashboard-main');

            const goToProfileBtn = document.getElementById('goToProfileBtn');
            if (goToProfileBtn) {
                goToProfileBtn.addEventListener('click', () => {
                    const profileMenu = document.getElementById('profileMenu');
                    if (profileMenu) profileMenu.classList.remove('active');
                    
                    document.querySelectorAll('.sidebar-link').forEach(l => {
                        l.classList.toggle('active', l.getAttribute('data-view') === 'profile');
                    });
                    document.querySelectorAll('.bottom-nav-item').forEach(l => {
                        l.classList.toggle('active', l.getAttribute('data-view') === 'profile');
                    });
                    renderView('profile');
                });
            }

            async function getHouses() {
                try {
                    const res = await fetch(`${API_BASE}/houses/`);
                    if (!res.ok) throw new Error('Failed to fetch houses');
                    return await res.json();
                } catch (error) {
                    console.error('Error fetching houses:', error);
                    return [];
                }
            }

            async function saveHouse(house) {
                try {
                    const res = await fetch(`${API_BASE}/houses/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: house.title,
                            location: house.location,
                            price: house.rawPrice,
                            description: house.description,
                            owner_name: house.ownerName,
                            owner_email: house.ownerEmail,
                            photo_urls: JSON.stringify(house.photos || []),
                            amenities: JSON.stringify(house.amenities || [])
                        })
                    });
                    if (!res.ok) throw new Error('Failed to save house');
                    return await res.json();
                } catch (error) {
                    console.error('Error saving house:', error);
                    alert('Failed to submit house. Please try again.');
                    return null;
                }
            }

            function formatHousePrice(price) {
                const value = Number(price);
                return isNaN(value) ? price : `Sh. ${value.toLocaleString('en-US')}`;
            }

            function renderHouseRows(houses, includeViews = false) {
                if (!houses.length) {
                    const colSpan = includeViews ? 6 : 5;
                    return `<tr><td colspan="${colSpan}" style="padding: 2rem; text-align: center; color: #64748B;">No house listings yet. Submit a new property and it will be sent for review.</td></tr>`;
                }

                return houses.map(house => {
                    const statusLabel = house.status === 'approved' ? 'Approved' : house.status === 'pending' ? 'Pending Review' : 'Rejected';
                    const statusClass = house.status === 'approved' ? 'status-approved' : house.status === 'pending' ? 'status-pending' : 'status-rejected';
                    return `
                        <tr>
                            <td>${house.title}</td>
                            <td>${house.location}</td>
                            <td>${formatHousePrice(house.price)}</td>
                            <td><span class="status-pill ${statusClass}">${statusLabel}</span></td>
                            ${includeViews ? `<td>${house.views || 0}</td>` : ''}
                            <td><button class="btn-text">Edit</button></td>
                        </tr>
                    `;
                }).join('');
            }

            async function getCurrentUserHouses() {
                const allHouses = await getHouses();
                return allHouses.filter(house => house.owner_email === user.email);
            }

            async function renderView(viewType) {
                mainContent.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 50vh; color: var(--text-secondary);">
                        <div style="font-size: 1.2rem; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                            <div class="spinner" style="width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
                            <div>Loading...</div>
                        </div>
                    </div>
                    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
                `;
                const userHouses = await getCurrentUserHouses();
                const recentHouses = userHouses.slice(0, 3);
                const totalHouses = userHouses.length;
                const pendingCount = userHouses.filter(house => house.status === 'pending').length;

                if (viewType === 'dashboard') {
                    mainContent.innerHTML = `
                        <div class="dashboard-header" style="margin-bottom: 2rem;">
                            <h1>Welcome back, <span>${user.name.split(' ')[0]}</span></h1>
                            <p>Manage your properties and track your performance.</p>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <span class="label">Your Listings</span>
                                <div class="value">${totalHouses}</div>
                            </div>
                            <div class="stat-card">
                                <span class="label">Pending Review</span>
                                <div class="value">${pendingCount}</div>
                            </div>
                            <div class="stat-card">
                                <span class="label">Approved Listings</span>
                                <div class="value">${userHouses.filter(h => h.status === 'approved').length}</div>
                            </div>
                            <div class="stat-card">
                                <span class="label">Estimated Revenue</span>
                                <div class="value">Sh. ${userHouses.filter(h => h.status === 'approved').reduce((sum, house) => sum + Number(house.price || 0), 0).toLocaleString('en-US')}</div>
                            </div>
                            <div class="stat-card">
                                <span class="label">Review Speed</span>
                                <div class="value">Fast</div>
                            </div>
                            <div class="stat-card">
                                <span class="label">Real-time Updates</span>
                                <div class="value">Enabled</div>
                            </div>
                        </div>
                        <div class="section-card" style="background: white; padding: 2rem; border-radius: 16px; border: 1px solid var(--border);">
                            <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                                <h2 class="dashboard-section-title">Recent Houses</h2>
                                <button class="btn btn-sm btn-primary js-add-house-btn">Add New House</button>
                            </div>
                            <div class="table-container">
                                <table>
                                    <thead><tr><th>House Name</th><th>Location</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
                                    <tbody>${renderHouseRows(recentHouses, false)}</tbody>
                                </table>
                            </div>
                        </div>
                    `;
                } else if (viewType === 'houses') {
                    mainContent.innerHTML = `
                        <div class="dashboard-header" style="margin-bottom: 2rem;">
                            <h1>My Houses</h1>
                            <p>Manage your property listings and review status.</p>
                        </div>
                        <div class="section-card" style="background: white; padding: 2rem; border-radius: 16px; border: 1px solid var(--border);">
                            <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                                <h2 class="dashboard-section-title">Houses</h2>
                                <button class="btn btn-sm btn-primary js-add-house-btn">Add New House</button>
                            </div>
                            <div class="table-container">
                                <table>
                                    <thead><tr><th>House Name</th><th>Location</th><th>Price</th><th>Status</th><th>Views</th><th>Actions</th></tr></thead>
                                    <tbody>${renderHouseRows(userHouses, true)}</tbody>
                                </table>
                            </div>
                        </div>
                    `;
                } else if (viewType === 'add-house') {
                    mainContent.innerHTML = `
                        <div class="dashboard-header" style="margin-bottom: 2rem;">
                            <h1>Add New House</h1>
                            <p>Submit a new property listing for review.</p>
                        </div>
                        <div class="section-card" style="background: white; padding: 2rem; border-radius: 16px; border: 1px solid var(--border);">
                            <form id="houseForm" style="max-width: 600px;">
                                <div class="form-group">
                                    <label>Property Photos (minimum 5)</label>
                                    <div class="photo-upload-grid">
                                        <label class="photo-upload-box">
                                            <input type="file" id="photo1" name="photo1" accept="image/*" required>
                                        </label>
                                        <label class="photo-upload-box">
                                            <input type="file" id="photo2" name="photo2" accept="image/*" required>
                                        </label>
                                        <label class="photo-upload-box">
                                            <input type="file" id="photo3" name="photo3" accept="image/*" required>
                                        </label>
                                        <label class="photo-upload-box">
                                            <input type="file" id="photo4" name="photo4" accept="image/*" required>
                                        </label>
                                        <label class="photo-upload-box">
                                            <input type="file" id="photo5" name="photo5" accept="image/*" required>
                                        </label>
                                    </div>
                                    <small style="display: block; margin-top: 0.5rem; color: var(--text-secondary);">Click each square to upload at least 5 property images. This listing will be sent for review before it goes live.</small>
                                </div>
                                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                                    <div class="form-group">
                                        <label for="houseType">House Type</label>
                                        <select id="houseType" required>
                                            <option value="" disabled selected>Select Type</option>
                                            <option value="Bedsitter">Bedsitter</option>
                                            <option value="Single Room">Single Room</option>
                                            <option value="Double Room">Double Room</option>
                                            <option value="Studio">Studio</option>
                                            <option value="1 Bedroom">1 Bedroom</option>
                                            <option value="2 Bedroom">2 Bedroom</option>
                                            <option value="3 Bedroom">3 Bedroom</option>
                                            <option value="4 Bedroom">4 Bedroom</option>
                                            <option value="Penthouse">Penthouse</option>
                                            <option value="Townhouse">Townhouse</option>
                                            <option value="Villa">Villa</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="estate">Estate / Area</label>
                                        <input type="text" id="estate" placeholder="e.g. Kileleshwa" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="county">County / City</label>
                                        <input type="text" id="county" placeholder="e.g. Nairobi" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="price">Monthly Price (Sh.)</label>
                                    <input type="number" id="price" placeholder="45000" required>
                                </div>
                                <div class="form-group" style="grid-column: 1 / -1; margin-top: 1rem;">
                                    <label>Amenities (Select all that apply)</label>
                                    <div class="amenities-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 1rem; margin-top: 0.5rem;">
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="WiFi" style="display: none;">
                                            <div class="amenity-content">📶 WiFi</div>
                                        </label>
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="Parking" style="display: none;">
                                            <div class="amenity-content">🚗 Parking</div>
                                        </label>
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="Water" style="display: none;">
                                            <div class="amenity-content">💧 Water</div>
                                        </label>
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="Security" style="display: none;">
                                            <div class="amenity-content">🛡️ Security</div>
                                        </label>
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="Borehole" style="display: none;">
                                            <div class="amenity-content">🚰 Borehole</div>
                                        </label>
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="Balcony" style="display: none;">
                                            <div class="amenity-content">🌅 Balcony</div>
                                        </label>
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="Gym" style="display: none;">
                                            <div class="amenity-content">🏋️ Gym</div>
                                        </label>
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="Pool" style="display: none;">
                                            <div class="amenity-content">🏊 Pool</div>
                                        </label>
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="CCTV" style="display: none;">
                                            <div class="amenity-content">📹 CCTV</div>
                                        </label>
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="Tokens" style="display: none;">
                                            <div class="amenity-content">⚡ Tokens</div>
                                        </label>
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="Generator" style="display: none;">
                                            <div class="amenity-content">🔋 Generator</div>
                                        </label>
                                        <label class="amenity-card">
                                            <input type="checkbox" name="amenity" value="Elevator" style="display: none;">
                                            <div class="amenity-content">🛗 Elevator</div>
                                        </label>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary">Submit for Approval</button>
                            </form>
                        </div>
                    `;



                    const houseForm = document.getElementById('houseForm');
                    if (houseForm) {
                        houseForm.addEventListener('submit', async (event) => {
                            event.preventDefault();
                            const houseType = houseForm.querySelector('#houseType').value;
                            const estate = houseForm.querySelector('#estate').value.trim();
                            const county = houseForm.querySelector('#county').value.trim();
                            const price = houseForm.querySelector('#price').value.trim();
                            
                            const amenityCheckboxes = houseForm.querySelectorAll('input[name="amenity"]:checked');
                            const amenities = Array.from(amenityCheckboxes).map(cb => cb.value);
                            
                            let description = `A beautiful ${houseType} located in ${estate}, ${county}. Available for Sh. ${price} per month.`;
                            if (amenities.length > 0) {
                                description += ` Features include: ${amenities.join(', ')}.`;
                            }
                            
                            if (!houseType || !estate || !county || !price) {
                                alert('Please fill in the required fields before submitting.');
                                return;
                            }

                            const title = `${houseType} in ${estate}`;
                            const location = `${estate}, ${county}`;

                            const newHouse = {
                                ownerName: user.name,
                                ownerEmail: user.email,
                                title,
                                location,
                                rawPrice: Number(price),
                                description,
                                amenities,
                                photos: [] // For now, empty; can add file upload later
                            };

                            const saved = await saveHouse(newHouse);
                            if (saved) {
                                alert('Your house listing has been submitted for review. It will appear on your dashboard once approved.');
                                setActiveSidebar('houses');
                                await renderView('houses');
                            }
                        });
                    }
                } else if (viewType === 'messages') {
                    mainContent.innerHTML = `
                        <div class="dashboard-header" style="margin-bottom: 2rem;">
                            <h1>Messages</h1>
                            <p>Communicate with renters interested in your properties.</p>
                        </div>
                        <div class="section-card" style="background: white; padding: 2rem; border-radius: 16px; border: 1px solid var(--border); text-align: center; padding: 4rem 2rem;">
                            <p style="font-size: 3rem; margin-bottom: 1rem;">💬</p>
                            <p style="color: var(--text-secondary); font-size: 1.1rem;">No messages yet</p>
                            <p style="color: var(--text-muted); margin-top: 0.5rem;">When renters reach out about your properties, messages will appear here.</p>
                        </div>
                    `;
                } else if (viewType === 'profile') {
                    const user = AuthManager.getCurrentUser();
                    mainContent.innerHTML = `
                        <div class="profile-section-container">
                            <div class="profile-header-premium">
                                <div class="profile-avatar-wrapper">
                                    <div class="profile-avatar-large"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
                                    <div class="profile-verified-badge"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                                </div>
                                <div class="profile-header-info">
                                    <span class="profile-designation">HomeView Caretaker</span>
                                    <h1>${user.name}</h1>
                                    <div class="profile-meta-chips">
                                        <div class="profile-chip">Verified Caretaker</div>
                                        <div class="profile-chip">Active Member</div>
                                        <div class="profile-chip">Joined ${user.joinedAt ? new Date(user.joinedAt).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) : 'May 2026'}</div>
                                    </div>
                                </div>
                            </div>
                            <div class="dashboard-form">
                                <div class="profile-left-column">
                                    <div class="profile-card-premium">
                                        <h3>Personal Information</h3>
                                        <form id="profileEditForm">
                                            <div class="profile-form-grid">
                                                <div class="profile-form-group">
                                                    <label>Full Name</label>
                                                    <input type="text" id="profileName" class="profile-input-modern" value="${user.name}">
                                                </div>
                                                <div class="profile-form-group">
                                                    <label>Email Address</label>
                                                    <input type="email" id="profileEmail" class="profile-input-modern" value="${user.email}" readonly style="opacity: 0.7; cursor: not-allowed;">
                                                </div>
                                            </div>
                                            <div class="profile-form-group">
                                                <label>Phone Number</label>
                                                <input type="text" id="profilePhone" class="profile-input-modern" value="${user.phone || ''}" placeholder="+254 7XX XXX XXX">
                                            </div>
                                            <div class="profile-actions-bar">
                                                <button type="submit" class="btn btn-primary" style="border-radius: 12px; padding: 0.8rem 2rem;">Save Changes</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    const profileForm = document.getElementById('profileEditForm');
                    if (profileForm) {
                        profileForm.addEventListener('submit', (e) => {
                            e.preventDefault();
                            const updatedData = {
                                name: document.getElementById('profileName').value,
                                bio: '',
                                phone: document.getElementById('profilePhone').value
                            };
                            
                            if (AuthManager.updateProfile(updatedData).success) {
                                alert('Profile updated successfully!');
                                window.location.reload();
                            }
                        });
                    }
                    if (window.ImageManager) ImageManager.applyProfilePictureToElements();
                }
            }

            function setActiveNavigation(viewType) {
                // Highlight sidebar links
                document.querySelectorAll('.sidebar-link').forEach(l => {
                    l.classList.toggle('active', l.getAttribute('data-view') === viewType);
                });
                // Highlight bottom-nav links
                document.querySelectorAll('.bottom-nav-item').forEach(l => {
                    l.classList.toggle('active', l.getAttribute('data-view') === viewType);
                });
                window.location.hash = viewType;
            }

            if (sidebarMenu) {
                sidebarMenu.addEventListener('click', async (e) => {
                    const link = e.target.closest('.sidebar-link');
                    if (!link) return;
                    
                    e.preventDefault();
                    
                    const view = link.getAttribute('data-view');
                    setActiveNavigation(view);
                    await renderView(view);
                });
            }

            const bottomNav = document.querySelector('.bottom-nav');
            if (bottomNav) {
                bottomNav.addEventListener('click', async (e) => {
                    const link = e.target.closest('.bottom-nav-item');
                    if (!link || !link.getAttribute('data-view')) return;
                    
                    e.preventDefault();
                    
                    const view = link.getAttribute('data-view');
                    setActiveNavigation(view);
                    await renderView(view);
                });
            }

            mainContent.addEventListener('click', async (e) => {
                const addButton = e.target.closest('.js-add-house-btn');
                if (!addButton) return;
                e.preventDefault();
                setActiveNavigation('add-house');
                await renderView('add-house');
            });

            const initialView = window.location.hash.replace('#', '') || 'dashboard';
            const validViews = ['dashboard', 'houses', 'add-house', 'messages', 'settings'];
            const viewToLoad = validViews.includes(initialView) ? initialView : 'dashboard';
            setActiveNavigation(viewToLoad);
            await renderView(viewToLoad);

            // User Profile Dropdown Toggle
            const userProfileToggle = document.getElementById('userProfileToggle');
            const profileMenu = document.getElementById('profileMenu');

            if (userProfileToggle && profileMenu) {
                userProfileToggle.addEventListener('click', () => {
                    profileMenu.classList.toggle('active');
                });

                // Close menu when clicking outside
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.user-profile-dropdown')) {
                        profileMenu.classList.remove('active');
                    }
                });
            }

            // Logout button
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    AuthManager.logout();
                });
            }
        });
    </script>
</body>
</html>
