<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - HomeView</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body class="tenant-dashboard">
    <header id="navbar">
        <div class="container mobile-header-bar">
            <button id="mobileNavToggle" class="mobile-nav-toggle" type="button" aria-label="Open menu">☰</button>
            <div id="userProfileToggle">
                <div class="user-dp">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="user-greeting">
                    <span class="greeting-text">Good morning,</span>
                    <span id="userName" class="user-name">Guest</span>
                </div>
            </div>
            <div class="profile-menu" id="profileMenu" style="left: 0; right: auto;">
                <div class="profile-menu-item" id="goToProfileBtn">
                    <span></span>
                    <span>My Profile</span>
                </div>
                <div class="profile-menu-item" id="logoutBtn">
                    <span></span>
                    <span>Sign Out</span>
                </div>
            </div>
            <div class="header-actions" style="margin-left: auto;">
                <a href="#" class="mobile-link-chip" data-view="profile">My Profile</a>
                <a href="listings.html" class="mobile-link-chip">Browse Houses</a>
            </div>
        </div>
    </header>

    <div class="mobile-drawer-backdrop" id="mobileDrawerBackdrop"></div>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-top-row">
                <strong>Menu</strong>
                <button id="mobileDrawerClose" class="drawer-close" type="button" aria-label="Close menu">✕</button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="index.html" class="sidebar-link">Home</a></li>
                <li><a href="listings.html" class="sidebar-link">Browse Houses</a></li>
                <li><a href="#" class="sidebar-link active" data-view="profile">My Profile</a></li>
                <li><a href="#" class="sidebar-link" data-view="saved">Saved Properties</a></li>
                <li><a href="#" class="sidebar-link" data-view="unlocked">Unlocked Locations</a></li>
                <li style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem;"><a href="#" class="sidebar-link" id="sidebarLogout" style="color: #EF4444;">Sign Out</a></li>
            </ul>
        </aside>

        <main class="dashboard-main" id="tenantMain">
            <!-- Dynamic content rendered here -->
        </main>
    </div>

        <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </span>
            <span>Home</span>
        </a>
        <a href="listings.html" class="bottom-nav-item active">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <span>Houses</span>
        </a>
        <a href="tenant-dashboard.html" class="bottom-nav-item">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </span>
            <span>Saved</span>
        </a>
        <a href="contact.html" class="bottom-nav-item">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </span>
            <span>Messages</span>
        </a>
        <a href="tenant-dashboard.html" class="bottom-nav-item">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <span>Profile</span>
        </a>
    </nav>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('hv_current_user'));
            const viewingAsTenant = localStorage.getItem('hv_caretaker_viewing_as_tenant');

            // Allow caretakers only if they explicitly chose "View as Tenant"
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            if (user.role === 'caretaker') {
                if (!viewingAsTenant) {
                    // Not explicitly switching — send them back to their dashboard
                    window.location.href = 'caretaker-dashboard.html';
                    return;
                }
            } else if (user.role !== 'tenant') {
                window.location.href = 'login.html';
                return;
            }


            const mainContent = document.getElementById('tenantMain');
            const sidebarMenu = document.querySelector('.sidebar-menu');

            function renderView(viewType) {

                if (viewType === 'profile') {
                    const user = AuthManager.getCurrentUser();
                    mainContent.innerHTML = `
                        <div class="profile-section-container">
                            <div class="profile-header-premium">
                                <div class="profile-avatar-wrapper">
                                    <div class="profile-avatar-large"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
                                    <div class="profile-verified-badge"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                                </div>
                                <div class="profile-header-info">
                                    <span class="profile-designation">HomeView Member</span>
                                    <h1>${user.name}</h1>
                                    <div class="profile-meta-chips">
                                        <div class="profile-chip">Verified Tenant</div>
                                        <div class="profile-chip">Active Member</div>
                                        <div class="profile-chip">Joined ${user.joinedAt ? new Date(user.joinedAt).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) : 'May 2026'}</div>
                                    </div>
                                </div>
                            </div>
                            <div class="dashboard-form">
                                <div class="profile-left-column">
                                    <div class="profile-card-premium">
                                        <h3>Personal Information</h3>
                                        <form id="profileEditForm">
                                            <div class="profile-form-grid">
                                                <div class="profile-form-group">
                                                    <label>Full Name</label>
                                                    <input type="text" id="profileName" class="profile-input-modern" value="${user.name}">
                                                </div>
                                                <div class="profile-form-group">
                                                    <label>Email Address</label>
                                                    <input type="email" id="profileEmail" class="profile-input-modern" value="${user.email}" readonly style="opacity: 0.7; cursor: not-allowed;">
                                                </div>
                                            </div>
                                            <div class="profile-form-group">
                                                <label>Phone Number</label>
                                                <input type="text" id="profilePhone" class="profile-input-modern" value="${user.phone || ''}" placeholder="+254 7XX XXX XXX">
                                            </div>
                                            <div class="profile-actions-bar">
                                                <button type="submit" class="btn btn-primary" style="border-radius: 12px; padding: 0.8rem 2rem;">Save Changes</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    const profileForm = document.getElementById('profileEditForm');
                    if (profileForm) {
                        profileForm.addEventListener('submit', (e) => {
                            e.preventDefault();
                            const updatedData = {
                                name: document.getElementById('profileName').value,
                                bio: document.getElementById('profileBio').value,
                                phone: document.getElementById('profilePhone').value
                            };
                            
                            if (AuthManager.updateProfile(updatedData).success) {
                                alert('Profile updated successfully!');
                                window.location.reload();
                            }
                        });
                    }
                } else if (viewType === 'saved') {
                    mainContent.innerHTML = `
                        <div class="empty-state-card">
                            <div class="empty-state-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            </div>
                            <h3>No saved properties yet</h3>
                            <p>Browse our collection of premium listings and save the ones that catch your eye.</p>
                            <a href="listings.html" class="btn btn-primary" style="margin-top: 2rem;">Browse Houses</a>
                        </div>
                    `;
                } else if (viewType === 'unlocked') {
                    const unlockedIds = JSON.parse(localStorage.getItem('hv_unlocked_' + user.id) || '[]');
                    mainContent.innerHTML = `
                        <div class="empty-state-card">
                            <div class="empty-state-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            </div>
                            <h3>${unlockedIds.length > 0 ? unlockedIds.length + ' location(s) unlocked' : 'No locations unlocked yet'}</h3>
                            <p>Once you unlock a property's precise location, it will appear here for your easy reference and site visits.</p>
                            <a href="listings.html" class="btn btn-primary" style="margin-top: 2rem;">Find Properties</a>
                        </div>
                    `;
                }
                if (window.ImageManager) ImageManager.applyProfilePictureToElements();
            }

            function setActiveSidebar(viewType) {
                document.querySelectorAll('.sidebar-link').forEach(l => {
                    l.classList.toggle('active', l.getAttribute('data-view') === viewType);
                });
            }

            // Sidebar Navigation - Using direct listeners for maximum reliability
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    const view = link.getAttribute('data-view');
                    if (view) {
                        e.preventDefault();
                        setActiveSidebar(view);
                        localStorage.setItem('hv_tenant_view', view);
                        renderView(view);
                    }
                });
            });

            // User Profile Dropdown + Navigation
            const userProfileToggle = document.getElementById('userProfileToggle');
            const profileMenu = document.getElementById('profileMenu');
            const goToProfileBtn = document.getElementById('goToProfileBtn');

            if (userProfileToggle && profileMenu) {
                userProfileToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    profileMenu.classList.toggle('active');
                });

                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.user-profile-dropdown')) {
                        profileMenu.classList.remove('active');
                    }
                });
            }

            if (goToProfileBtn) {
                goToProfileBtn.addEventListener('click', () => {
                    profileMenu.classList.remove('active');
                    setActiveSidebar('profile');
                    localStorage.setItem('hv_tenant_view', 'profile');
                    renderView('profile');
                });
            }

            // Logout
            const logoutBtns = [document.getElementById('logoutBtn'), document.getElementById('sidebarLogout')];
            logoutBtns.forEach(btn => {
                if (btn) {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        AuthManager.logout();
                    });
                }
            });

            // Check for next view flag (from navbar redirect) or restore saved view after refresh
            const nextView = localStorage.getItem('hv_next_view');
            const savedView = localStorage.getItem('hv_tenant_view') || 'profile';
            let initialView = nextView || savedView;
            if (nextView) {
                localStorage.removeItem('hv_next_view');
            }
            if (!['profile', 'saved', 'unlocked'].includes(initialView)) {
                initialView = 'profile';
            }
            setActiveSidebar(initialView);
            renderView(initialView);
        });
    </script>
</body>
</html>
